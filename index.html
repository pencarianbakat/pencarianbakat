<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📥 Video Downloader · Google Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0b0e1a, #141a2b);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f0f4ff;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(22, 28, 48, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 40px 16px 40px 16px;
            padding: 40px 36px 36px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            transition: 0.2s;
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.15);
            padding-bottom: 18px;
        }
        .header .icon {
            font-size: 2.8rem;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.4));
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header span {
            font-size: 0.85rem;
            font-weight: 400;
            color: #9aa4bf;
            display: block;
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #c8d0e6;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 60px;
            border: 2px solid #2a3450;
            background: #0f1425;
            color: #f0f4ff;
            font-size: 1rem;
            transition: 0.2s;
            outline: none;
        }
        .input-row input:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.2);
        }
        .input-row input::placeholder {
            color: #6a7a9a;
        }

        .btn-download {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0b0e1a;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #7a4d00;
            flex-shrink: 0;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #7a4d00;
            background: #ffe066;
        }
        .btn-download:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a4d00;
        }
        .btn-download:disabled {
            opacity: 0.6;
            transform: translateY(0);
            box-shadow: 0 4px 0 #7a4d00;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid #facc15;
            font-size: 0.95rem;
            line-height: 1.6;
            min-height: 60px;
            word-break: break-all;
        }
        .status-box .loading {
            color: #facc15;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .status-box .error {
            color: #ff6b6b;
        }
        .status-box .success {
            color: #4ecdc4;
        }
        .status-box a {
            color: #facc15;
            text-decoration: none;
            font-weight: 600;
        }
        .status-box a:hover {
            text-decoration: underline;
        }

        .info-box {
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #9aa4bf;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-box strong {
            color: #facc15;
        }
        .info-box .highlight {
            color: #ff9f43;
        }

        @media (max-width: 550px) {
            .card {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .header .icon {
                font-size: 2rem;
            }
            .input-row {
                flex-direction: column;
            }
            .btn-download {
                width: 100%;
                justify-content: center;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="icon">📥</div>
            <div>
                <h1>Video Downloader</h1>
                <span>Simpan video langsung ke Google Drive</span>
            </div>
        </div>

        <div class="form-group">
            <label for="urlInput">🔗 Masukkan link video (mp4, mov, dll.)</label>
            <div class="input-row">
                <input
                type="url"
                id="urlInput"
                placeholder="https://contoh.com/video.mp4"
                autofocus
                />
                <button class="btn-download" id="downloadBtn">⬇ Download</button>
            </div>
        </div>

        <div class="status-box" id="statusBox">
            💡 Tempel link video lalu klik Download
        </div>

        <div class="info-box">
            <strong>📌 Catatan:</strong> Hanya mendukung <span class="highlight">link video langsung</span> (.mp4, .mov, .webm, dll.).
            <br>Ukuran maksimal <strong>50MB</strong> (batas Apps Script).
            <br>Video akan disimpan ke Google Drive Anda.
        </div>
    </div>

    <script>
        (function() {
            // ===== KONFIGURASI =====
            // URL Web App Anda (sudah disesuaikan)
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwVSboL1Cn6KBun_g1R5ccTLmBx_HnSF85MrJEVBQ6f0G4L3UOmYjjjy6FhozvqrnLB1A/exec';

            const urlInput = document.getElementById('urlInput');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusBox = document.getElementById('statusBox');

            // ===== FUNGSI =====
            function setStatus(html, type = 'info') {
                statusBox.innerHTML = html;
                statusBox.className = 'status-box ' + type;
            }

            function getFileNameFromUrl(url) {
                try {
                    const u = new URL(url);
                    const path = u.pathname;
                    const parts = path.split('/');
                    let file = parts[parts.length - 1] || 'video';
                    if (!file.includes('.')) file += '.mp4';
                    return file;
                } catch {
                    return 'video_' + Date.now() + '.mp4';
                }
            }

            async function handleDownload() {
                let url = urlInput.value.trim();
                if (!url) {
                    setStatus('📛 Masukkan URL video terlebih dahulu.', 'error');
                    return;
                }

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                const fileName = getFileNameFromUrl(url);

                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ Mengunduh...';
                setStatus('⏳ Mengirim permintaan ke server... <span class="loading">●</span>', 'loading');

                try {
                    const payload = { videoUrl: url, fileName: fileName };

                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        const data = result.data;
                        setStatus(`
                            ✅ <span class="success">Video berhasil diunduh!</span><br>
                            📁 Nama file: <strong>${data.fileName}</strong><br>
                            📦 Ukuran: <strong>${data.size}</strong><br>
                            🔗 <a href="${data.fileUrl}" target="_blank">Buka di Google Drive</a>
                        `, 'success');
                    } else {
                        setStatus(`❌ <span class="error">${result.message || 'Gagal mengunduh video.'}</span>`, 'error');
                    }

                } catch (err) {
                    setStatus(`❌ <span class="error">Terjadi kesalahan: ${err.message}</span>`, 'error');
                }

                downloadBtn.disabled = false;
                downloadBtn.textContent = '⬇ Download';
            }

            // ===== EVENT =====
            downloadBtn.addEventListener('click', handleDownload);

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleDownload();
                }
            });

            console.log('🚀 Video Downloader siap! Web App terhubung.');
        })();
    </script>

</body>
</html>
